name: Backend Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    # 1. Spin up a live Postgres instance for isolated testing
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: easyworship_test
        ports:
          - 5432:5432
        # Ensures the test runner doesn't start until Postgres is completely ready
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # 2. Pull down your source code
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      # 3. Set up Python environment matching your local 3.12 stack
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      # 4. Cache dependencies to speed up subsequent workflow runs
      - name: Cache Pip Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # 5. Install project and testing requirements
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-asyncio httpx faker
          
      # 6. Execute the test suite with configuration injection
      - name: Run Tests
        env:
          # Points the application to the test DB container running on the Actions runner host
          DATABASE_URL: postgresql+asyncpg://postgres:password@localhost:5432/easyworship_test
          DATABASE_SYNC_URL: postgresql+psycopg2://postgres:password@localhost:5432/easyworship_test
        run: |
          cd backend
          PYTHONPATH=. pytest app/tests/ -v